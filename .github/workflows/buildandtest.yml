name: CI Build and Test

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Branch name for artifact naming'
        required: true
        type: string
    secrets:
      GH_TOKEN:
        description: 'GitHub token for accessing artifacts from other repositories (PAT or GitHub App token). If not provided, will only access public repositories.'
        required: false
      APP_ID:
        description: 'GitHub App ID (alternative to GH_TOKEN)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (alternative to GH_TOKEN)'
        required: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: BHoM/GithubActions/.github/workflows/build.yml@develop
    with:
      branch_name: ${{ inputs.branch_name || github.ref_name }}
    secrets: inherit

  test:
    name: Test
    needs: build
    uses: BHoM/GithubActions/.github/workflows/test.yml@develop
    with:
      branch_name: ${{ inputs.branch_name || github.ref_name }}
      release-configurations: ${{ needs.build.outputs.release-configurations }}
      changed-files: ${{ needs.build.outputs.changed-files }}
    secrets: inherit
