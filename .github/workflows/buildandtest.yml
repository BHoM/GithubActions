name: BHoM Build Workflow

on:
  workflow_call:
    inputs:
      repository_name:
        description: 'Name of the repository being built'
        required: true
        type: string
      branch_name:
        description: 'Branch name being built'
        required: true
        type: string
      dotnet_version:
        description: '.NET version to use'
        required: false
        type: string
        default: '8.0.x'

    secrets:
      GH_TOKEN:
        description: 'GitHub token for accessing artifacts from other repositories (PAT or GitHub App token). If not provided, will only access public repositories.'
        required: false
      APP_ID:
        description: 'GitHub App ID (alternative to GH_TOKEN)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (alternative to GH_TOKEN)'
        required: false

concurrency:  # cancel in progress runs if this workflow is triggered again. Makes sure new commits cancel previous runs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-dependencies:
    runs-on: windows-latest
    outputs:
      build-configurations: ${{ steps.discover-configs.outputs.build-configurations }}
      release-configurations: ${{ steps.discover-configs.outputs.release-configurations }}
      dependencies-built: ${{ steps.build-summary.outputs.dependencies-built }}
      changed-files: ${{ steps.get-changed-files.outputs.changed-files }}
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover build configurations
        id: discover-configs
        run: |
          # Find the .sln file in the current directory
          $sln_files = Get-ChildItem -Filter "*.sln" -File
          
          if ($sln_files.Count -eq 0) {
            Write-Host "✗ No .sln file found in root directory" -ForegroundColor Red
            echo "build-configurations=[]" >> $env:GITHUB_OUTPUT
            echo "release-configurations=[]" >> $env:GITHUB_OUTPUT
            exit 1
          }
          
          if ($sln_files.Count -gt 1) {
            Write-Host "⚠ Multiple .sln files found, using the first one: $($sln_files[0].Name)" -ForegroundColor Yellow
          }
          
          $sln_file = $sln_files[0]
          Write-Host "Analyzing solution file: $($sln_file.Name)" -ForegroundColor Cyan
          
          # Parse solution file to find build configurations
          $content = Get-Content $sln_file.FullName
          $configs = @()
          $releaseConfigs = @()
          
          # Look for GlobalSection(SolutionConfigurationPlatforms) section
          $inConfigSection = $false
          foreach ($line in $content) {
            if ($line -match "GlobalSection\(SolutionConfigurationPlatforms\)") {
              $inConfigSection = $true
              continue
            }
            if ($inConfigSection -and $line -match "EndGlobalSection") {
              break
            }
            if ($inConfigSection -and $line -match "^\s*([^=]+)\s*=") {
              $fullConfig = $matches[1].Trim()
              # Extract only the configuration name (before the pipe)
              if ($fullConfig -match "^([^|]+)") {
                $config = $matches[1].Trim()
                if ($configs -notcontains $config) {
                  $configs += $config
                  Write-Host "Found build configuration: $config"
                  
                  # Check if it's a Release configuration (starts with "Release")
                  if ($config -match "^Release") {
                    $releaseConfigs += $config
                    Write-Host "  → Identified as Release configuration"
                  }
                }
              }
            }
          }
          
          if ($configs.Count -eq 0) {
            Write-Host "⚠ No build configurations found in solution file, using default" -ForegroundColor Yellow
            $configs = @("Debug", "Release")
            $releaseConfigs = @("Release")
          }
          
          Write-Host "`nDiscovered build configurations:"
          for ($i = 0; $i -lt $configs.Count; $i++) {
            Write-Host "  $($i + 1). $($configs[$i])"
          }
          
          Write-Host "`nRelease configurations (for artifact download):"
          for ($i = 0; $i -lt $releaseConfigs.Count; $i++) {
            Write-Host "  $($i + 1). $($releaseConfigs[$i])"
          }
          
          # Convert to JSON for matrix strategy
          $configsJson = $configs | ConvertTo-Json -Compress
          $releaseConfigsJson = $releaseConfigs | ConvertTo-Json -Compress
          
          echo "build-configurations=$configsJson" >> $env:GITHUB_OUTPUT
          echo "release-configurations=$releaseConfigsJson" >> $env:GITHUB_OUTPUT
        shell: pwsh



      - name: Parse dependencies
        id: parse-deps
        run: |
          if (Test-Path "dependencies.txt") {
            $deps = Get-Content "dependencies.txt" | Where-Object { $_.Trim() -and !$_.StartsWith("#") } | ConvertTo-Json -Compress
            echo "dependencies=$deps" >> $env:GITHUB_OUTPUT
          } else {
            echo "dependencies=[]" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Get changed files
        id: get-changed-files
        run: |
          $branchName = '${{ inputs.branch_name }}'
          Write-Host "Current branch: $branchName"
          
          if ($branchName -eq 'develop') {
            Write-Host "Running on develop branch - no changed files to track"
            echo "changed-files=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Getting list of changed files compared to develop..."
            
            # Fetch develop branch for comparison
            try {
              Write-Host "Fetching develop branch..."
              git fetch origin develop:develop 2>&1 | Write-Host
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Successfully fetched develop branch, comparing files..."
                
                # Debug: Show current commit and develop commit
                $currentCommit = git rev-parse HEAD
                $developCommit = git rev-parse develop
                Write-Host "Current commit: $currentCommit"
                Write-Host "Develop commit: $developCommit"
                
                # Compare current branch (HEAD) with develop using two-dot syntax
                Write-Host "Comparing current branch with develop branch..."
                $changedFiles = git diff --name-only develop HEAD 2>&1
                $gitDiffExitCode = $LASTEXITCODE
                
                Write-Host "Git diff exit code: $gitDiffExitCode"
                if ($changedFiles) {
                  Write-Host "Found $($changedFiles.Count) changed files"
                  # Show first few files for debugging
                  $displayCount = [Math]::Min(5, $changedFiles.Count)
                  Write-Host "First $displayCount files:"
                  for ($i = 0; $i -lt $displayCount; $i++) {
                    Write-Host "  $($changedFiles[$i])"
                  }
                  if ($changedFiles.Count -gt 5) {
                    Write-Host "  ... and $($changedFiles.Count - 5) more files"
                  }
                } else {
                  Write-Host "No files returned from git diff"
                }
                
                # Reset exit code for this step
                $LASTEXITCODE = 0
                
                if ($gitDiffExitCode -eq 0) {
                  if ($changedFiles -and $changedFiles.Count -gt 0) {
                    # Convert to full paths and join with semicolons
                    $fullPaths = @()
                    foreach ($file in $changedFiles) {
                      if ($file -and $file.Trim()) {
                        $fullPath = Join-Path (Get-Location) $file.Trim()
                        $fullPaths += $fullPath
                      }
                    }
                    
                    if ($fullPaths.Count -gt 0) {
                      $changedFilesString = $fullPaths -join ';'
                      Write-Host "Changed files ($($fullPaths.Count)):"
                      foreach ($file in $fullPaths) {
                        Write-Host "  $file"
                      }
                      echo "changed-files=$changedFilesString" >> $env:GITHUB_OUTPUT
                    } else {
                      Write-Host "No valid changed files detected after filtering"
                      echo "changed-files=" >> $env:GITHUB_OUTPUT
                    }
                  } else {
                    Write-Host "No changes found compared to develop branch (this is normal)"
                    echo "changed-files=" >> $env:GITHUB_OUTPUT
                  }
                } else {
                  Write-Host "Git diff returned exit code $gitDiffExitCode, treating as no changes"
                  echo "changed-files=" >> $env:GITHUB_OUTPUT
                }
              } else {
                Write-Host "⚠ Could not fetch develop branch, skipping changed files detection" -ForegroundColor Yellow
                echo "changed-files=" >> $env:GITHUB_OUTPUT
              }
            } catch {
              Write-Host "⚠ Error during git operations: $($_.Exception.Message)" -ForegroundColor Yellow
              Write-Host "Skipping changed files detection"
              echo "changed-files=" >> $env:GITHUB_OUTPUT
            }
            
            # Ensure step always succeeds
            $LASTEXITCODE = 0
          }
        shell: pwsh

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2.0.1

      - name: Create BHoM folder
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Check GitHub App secrets
        id: check-app-secrets
        run: |
          if [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "app-secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "app-secrets-available=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.check-app-secrets.outputs.app-secrets-available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Determine dependency branches
        id: determine-branches
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          $dependencies = '${{ steps.parse-deps.outputs.dependencies }}' | ConvertFrom-Json
          $branch_name = '${{ inputs.branch_name }}'
          $branchMap = @{}
          
          Write-Host "Determining branches for dependencies..."
          Write-Host "Target branch: $branch_name"
          
          # URL encode the branch name for API calls (handles special characters like #)
          $encodedBranchName = [System.Web.HttpUtility]::UrlEncode($branch_name)

          foreach ($dep in $dependencies) {
            Write-Host "Checking branch availability for $dep"

            # Check if target branch exists in the dependency repo
            $branchExists = $false
            try {
              $branchResult = gh api "/repos/$dep/branches/$encodedBranchName" 2>$null
              if ($LASTEXITCODE -eq 0 -and $branchResult) {
                $branchExists = $true
                Write-Host "  ✓ Branch '$branch_name' exists"
              }
            } catch {
              # Branch doesn't exist or no access
            }
            
            # Reset exit code to prevent step failure
            $LASTEXITCODE = 0
            
            if ($branchExists) {
              $branchMap[$dep] = $branch_name
            } else {
              $branchMap[$dep] = "develop"
              Write-Host "  → Falling back to 'develop' branch"
            }
          }
          
          # Display final branch mapping
          Write-Host "`nBranch mapping for dependencies:"
          foreach ($dep in $dependencies) {
            Write-Host "  $dep → $($branchMap[$dep])"
          }
          
          # Convert to JSON for use in subsequent steps
          $branchMapJson = $branchMap | ConvertTo-Json -Compress
          echo "branch-map=$branchMapJson" >> $env:GITHUB_OUTPUT
          
          # Ensure step always succeeds
          $LASTEXITCODE = 0
        shell: pwsh

      - name: Download dependency artifacts
        id: download-deps
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          $dependencies = '${{ steps.parse-deps.outputs.dependencies }}' | ConvertFrom-Json
          $branchMap = '${{ steps.determine-branches.outputs.branch-map }}' | ConvertFrom-Json
          $downloaded_artifacts = @()
          
          # Determine authentication method
          if ('${{ steps.generate-token.outputs.token }}' -ne '') {
            Write-Host "Using GitHub App authentication"
          } elseif ('${{ secrets.GH_TOKEN }}' -ne '') {
            Write-Host "Using provided token"
          } else {
            Write-Host "Using default GITHUB_TOKEN"
          }
          
          Write-Host "Downloading artifacts using pre-determined branches..."
          
          if ($dependencies.Count -gt 0) {
            foreach ($dep in $dependencies) {
              $target_branch = $branchMap.$dep
              Write-Host "Processing dependency: $dep (branch: $target_branch)"
              
              # Get latest run of the BHoM Build Workflow for the target branch (regardless of status)
              $runsResponse = gh api "/repos/$dep/actions/runs?per_page=50" 2>$null
              if ($LASTEXITCODE -ne 0) {
                Write-Host "No access to $dep on $target_branch - will need to build"
                continue
              }
              
              $runs = $runsResponse | ConvertFrom-Json
              $workflowRuns = $runs.workflow_runs | Where-Object { 
                $_.head_branch -eq $target_branch -and $_.name -eq "CI Build and Test"
              }
              
              if (-not $workflowRuns -or $workflowRuns.Count -eq 0) {
                Write-Host "No CI Build and Test workflow runs found for $dep on $target_branch - will need to build"
                continue
              }
              
              $latestRun = $workflowRuns[0]
              $run_id = $latestRun.id
              Write-Host "Found latest CI Build and Test workflow run: $run_id for $dep on $target_branch (status: $($latestRun.status), conclusion: $($latestRun.conclusion))"
              
              # Get Release configurations to try
              $releaseConfigs = '${{ steps.discover-configs.outputs.release-configurations }}' | ConvertFrom-Json
              if ($releaseConfigs.Count -eq 0) { $releaseConfigs = @("Release") }
              
              $found = $false
              $waitAttempts = 0
              $maxWaitAttempts = 10
              
              # Check for artifacts, even if workflow is still running
              while ($waitAttempts -le $maxWaitAttempts -and -not $found) {
                if ($waitAttempts -gt 0) {
                  Write-Host "Wait attempt $waitAttempts/$maxWaitAttempts - checking for artifacts..."
                  Start-Sleep -Seconds 10
                }
                
                # Check run status and artifacts
                if ($waitAttempts -gt 0) {
                  $runStatusResponse = gh api "/repos/$dep/actions/runs/$run_id" 2>$null
                  if ($runStatusResponse) {
                    $latestRun = $runStatusResponse | ConvertFrom-Json
                    Write-Host "Run status: $($latestRun.status), conclusion: $($latestRun.conclusion)"
                  }
                }
                
                # Check if artifacts are available
                $artifactsResponse = gh api "/repos/$dep/actions/runs/$run_id/artifacts" 2>$null
                if ($artifactsResponse) {
                  $allArtifacts = $artifactsResponse | ConvertFrom-Json
                  
                  if ($allArtifacts.artifacts -and $allArtifacts.artifacts.Count -gt 0) {
                    Write-Host "Run has $($allArtifacts.artifacts.Count) artifacts available"
                    
                    # Look for the specific artifacts we need
                    foreach ($releaseConfig in $releaseConfigs) {
                      $artifact_name = "build-outputs-$target_branch-$releaseConfig"
                      Write-Host "Looking for artifact: $artifact_name"
                      
                      $targetArtifact = $allArtifacts.artifacts | Where-Object { $_.name -eq $artifact_name }
                      
                      if ($targetArtifact) {
                        Write-Host "✓ Found artifact: $artifact_name from $dep"
                        $dep_safe = $dep.Replace('/', '_')
                        
                        # Download and extract
                        gh api "/repos/$dep/actions/artifacts/$($targetArtifact.id)/zip" > "${dep_safe}_artifact.zip"
                        New-Item -ItemType Directory -Force -Path "dependencies\$dep_safe"
                        Expand-Archive -Path "${dep_safe}_artifact.zip" -DestinationPath "dependencies\$dep_safe" -Force
                        
                        # Copy to BHoM folder
                        if (Test-Path "dependencies\$dep_safe") {
                          Copy-Item "dependencies\$dep_safe\*" -Destination "$env:BHoMFolder\" -Recurse -Force -ErrorAction SilentlyContinue
                        }
                        
                        Write-Host "✓ Successfully downloaded artifact for $dep for configuration $releaseConfig"
                        $found = $true
                        break
                      }
                    }
                    
                    if ($found) {
                      break
                    }
                  }
                }
                
                # If workflow is completed and we still haven't found artifacts, exit with error
                if ($latestRun.status -eq "completed" -and -not $found) {
                  if ($allArtifacts.artifacts -and $allArtifacts.artifacts.Count -gt 0) {
                    Write-Host "Available artifacts in run ${run_id}:"
                    foreach ($art in $allArtifacts.artifacts) {
                      Write-Host "  - $($art.name)"
                    }
                    Write-Host "✗ CRITICAL ERROR: Expected artifact not found for dependency $dep" -ForegroundColor Red
                    Write-Host "Expected artifacts matching pattern: build-outputs-$target_branch-[Release configs]" -ForegroundColor Red
                  } else {
                    Write-Host "✗ CRITICAL ERROR: Completed run $run_id has no artifacts for dependency $dep" -ForegroundColor Red
                    Write-Host "This indicates the dependency build failed or did not produce expected outputs." -ForegroundColor Red
                  }
                  exit 1
                }
                
                # If workflow is still running, continue waiting
                if ($latestRun.status -eq "in_progress" -or $latestRun.status -eq "queued") {
                  if ($waitAttempts -eq 0) {
                    Write-Host "Run $run_id is still running, will check for artifacts while waiting..."
                  }
                  $waitAttempts++
                } else {
                  # Workflow completed but no artifacts found
                  break
                }
              }
              
              if ($found) {
                $downloaded_artifacts += $dep
                Write-Host "✓ Completed artifact downloads for $dep"
              } else {
                if ($waitAttempts -gt $maxWaitAttempts) {
                  Write-Host "✗ Run did not complete or produce artifacts after $maxWaitAttempts wait attempts - will need to build"
                } else {
                  Write-Host "✗ No suitable artifacts found for $dep - will need to build"
                }
              }
            }
          }
          
          # Output results
          $downloaded_string = $downloaded_artifacts -join ","
          echo "artifacts-downloaded=$downloaded_string" >> $env:GITHUB_OUTPUT
          Write-Host "✓ Artifact resolution completed. Downloaded: $($downloaded_artifacts.Count) dependencies"
        shell: pwsh

      - name: Clone missing dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $dependencies = '${{ steps.parse-deps.outputs.dependencies }}' | ConvertFrom-Json
          $downloaded = '${{ steps.download-deps.outputs.artifacts-downloaded }}' -split ',' | Where-Object { $_ -ne "" }
          $branchMap = '${{ steps.determine-branches.outputs.branch-map }}' | ConvertFrom-Json
          
          # Create repositories directory
          New-Item -ItemType Directory -Force -Path "Repositories"
          
          # Process only missing dependencies
          foreach ($dep in $dependencies) {
            if ($downloaded -notcontains $dep) {
              $target_branch = $branchMap.$dep
              Write-Host "Processing missing dependency: $dep (branch: $target_branch)"
              
              # Extract repo name from dependency
              $repo_name = $dep.Split('/')[-1]
              $repo_url = "https://github.com/$dep.git"
              
              Write-Host "Cloning repository: $repo_name from $repo_url"
              
              try {
                git clone $repo_url "Repositories\$repo_name"
                
                # Checkout the pre-determined branch (we know it exists)
                Push-Location "Repositories\$repo_name"
                git checkout "$target_branch"
                Write-Host "✓ Checked out branch: $target_branch"
                Pop-Location
                
                Write-Host "Successfully cloned $repo_name"
                
                # Check if .sln file exists in base folder
                $sln_files = Get-ChildItem "Repositories\$repo_name" -Filter "*.sln" -File
                if ($sln_files.Count -gt 0) {
                  Write-Host "✓ Found .sln file in $repo_name - keeping repository"
                  $repo_name | Add-Content "valid_repos.txt" -Encoding UTF8
                } else {
                  Write-Host "✗ No .sln file found in base folder of $repo_name - Repo not built"
                }
              } catch {
                Write-Host "Failed to clone $repo_name"
              }
            }
          }
          
          # Show summary
          if (Test-Path "valid_repos.txt") {
            Write-Host "Valid repositories to compile:"
            Get-Content "valid_repos.txt"
          } else {
            Write-Host "No valid repositories found with .sln files"
          }
        shell: pwsh

      - name: Analyze dependency order
        run: |
          if (!(Test-Path "valid_repos.txt")) {
            Write-Host "No valid repositories to analyze"
            exit 0
          }
          
          # Read all valid repositories
          $validRepos = Get-Content "valid_repos.txt" | ForEach-Object { $_.Trim() }
          Write-Host "Analyzing dependency order for $($validRepos.Count) repositories..."
          
          # Create dependency map
          $dependencyMap = @{}
          
          foreach ($repo in $validRepos) {
            $dependencyMap[$repo] = @()
            $depsFile = "Repositories\$repo\dependencies.txt"
            
            if (Test-Path $depsFile) {
              Write-Host "Found dependencies.txt in $repo"
              $repoDeps = Get-Content $depsFile | ForEach-Object { 
                $line = $_.Trim()
                if (![string]::IsNullOrWhiteSpace($line) -and !$line.StartsWith("#")) {
                  # Extract just the repo name from ORG/REPO format
                  $repoName = $line.Split('/')[-1]
                  return $repoName
                }
              } | Where-Object { $_ -ne $null }
              
              # Only include dependencies that are in our valid repos list
              $validDeps = $repoDeps | Where-Object { $validRepos -contains $_ }
              $dependencyMap[$repo] = $validDeps
              
              if ($validDeps.Count -gt 0) {
                Write-Host "$repo depends on: $($validDeps -join ', ')"
              } else {
                Write-Host "$repo has no dependencies in current build set"
              }
            } else {
              Write-Host "$repo has no dependencies.txt file"
            }
          }
          
          # Topological sort to determine build order
          $script:buildOrder = @()
          $script:visited = @{}
          $script:visiting = @{}
          
          function Get-BuildOrder {
            param([string]$repo)
            
            Write-Host "Processing $repo for build order..." -ForegroundColor Cyan
            
            if ($script:visiting.ContainsKey($repo)) {
              Write-Host "⚠ Circular dependency detected involving $repo" -ForegroundColor Yellow
              return $false
            }
            
            if ($script:visited.ContainsKey($repo)) {
              Write-Host "$repo already processed" -ForegroundColor Gray
              return $true
            }
            
            $script:visiting[$repo] = $true
            Write-Host "Visiting dependencies of $repo..."
            
            # Visit all dependencies first
            if ($dependencyMap.ContainsKey($repo) -and $dependencyMap[$repo].Count -gt 0) {
              Write-Host "$repo has dependencies: $($dependencyMap[$repo] -join ', ')"
              foreach ($dep in $dependencyMap[$repo]) {
                if ($validRepos -contains $dep) {
                  Write-Host "Processing dependency: $dep"
                  $result = Get-BuildOrder -repo $dep
                  if (-not $result) {
                    Write-Host "Failed to process dependency $dep" -ForegroundColor Red
                    return $false
                  }
                } else {
                  Write-Host "Skipping dependency $dep (not in current build set)" -ForegroundColor Yellow
                }
              }
            } else {
              Write-Host "$repo has no dependencies"
            }
            
            $script:visiting.Remove($repo)
            $script:visited[$repo] = $true
            $script:buildOrder += $repo
            Write-Host "Added $repo to build order (position $($script:buildOrder.Count))" -ForegroundColor Green
            return $true
          }
          
          # Process all repositories
          Write-Host "Starting topological sort for $($validRepos.Count) repositories..."
          $sortSuccess = $true
          foreach ($repo in $validRepos) {
            if (-not $script:visited.ContainsKey($repo)) {
              Write-Host "Processing root repository: $repo" -ForegroundColor Magenta
              $result = Get-BuildOrder -repo $repo
              if (-not $result) {
                $sortSuccess = $false
                    break
              }
            }
          }
          
          if (-not $sortSuccess) {
            Write-Host "⚠ Topological sort failed due to circular dependencies. Using original order." -ForegroundColor Yellow
            $script:buildOrder = $validRepos
          }
          
          $buildOrder = $script:buildOrder
          
          # Save build order
          $buildOrder | Out-File "build_order.txt" -Encoding UTF8
          
          Write-Host "Determined build order:"
          for ($i = 0; $i -lt $buildOrder.Count; $i++) {
            Write-Host "  $($i + 1). $($buildOrder[$i])"
          }
        shell: pwsh

      - name: Compile missing dependencies
        run: |
          if (!(Test-Path "build_order.txt")) {
            Write-Host "No build order file found, checking for valid repositories..."
            if (!(Test-Path "valid_repos.txt")) {
              Write-Host "No valid repositories to compile"
              exit 0
            }
            # Fallback to original order if build_order.txt doesn't exist
            Get-Content "valid_repos.txt" | Out-File "build_order.txt" -Encoding UTF8
          }
          
          # Read build order
          $buildOrder = Get-Content "build_order.txt" | ForEach-Object { $_.Trim() } | Where-Object { ![string]::IsNullOrWhiteSpace($_) }
          Write-Host "Building $($buildOrder.Count) repositories in dependency order..."
          
          # Compile each repository in the correct order
          foreach ($repo_name in $buildOrder) {
            Write-Host "Compiling repository: $repo_name"
              
              # Take snapshot of BHoM folder before build
              $preFiles = @{}
            if (Test-Path "$env:BHoMFolder") {
              Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
                  $preFiles[$_.FullName] = $_.LastWriteTime
                }
              }
              
            Push-Location "Repositories\$repo_name"
            
            try {
              # Find and restore packages for all .sln files
              Get-ChildItem -Filter "*.sln" -File | ForEach-Object {
                Write-Host "Restoring packages for $($_.Name)"
                dotnet restore $_.Name 2>&1 | Tee-Object -Variable restoreOutput
                Write-Host $restoreOutput
              }
              
              # Get release configurations to build
              $releaseConfigs = '${{ steps.discover-configs.outputs.release-configurations }}' | ConvertFrom-Json
              
              # If no release configs found, fallback to just "Release"
              if ($releaseConfigs.Count -eq 0) {
                Write-Host "No Release configurations discovered, falling back to 'Release'"
                $releaseConfigs = @("Release")
              }
              
              Write-Host "Building dependency $repo_name for configurations: $($releaseConfigs -join ', ')"
              
              # Build all .sln files in the repository for each Release configuration
              Get-ChildItem -Filter "*.sln" -File | ForEach-Object {
                $slnFile = $_
                
                foreach ($config in $releaseConfigs) {
                  Write-Host "Building $($slnFile.Name) with configuration $config using dotnet build"
                  dotnet build $slnFile.Name --configuration $config --no-restore 2>&1 | Tee-Object -Variable buildOutput
                  Write-Host $buildOutput
                  
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "✓ Successfully built $($slnFile.Name) [$config] with dotnet build"
                  } else {
                    Write-Host "✗ dotnet build failed for $($slnFile.Name) [$config], trying MSBuild..." -ForegroundColor Yellow
                    Write-Host "dotnet build errors:" -ForegroundColor Red
                    Write-Host $buildOutput -ForegroundColor Red
                    
                    # Restore packages with MSBuild/NuGet
                    Write-Host "Restoring packages with NuGet..."
                    nuget restore $slnFile.Name
                    
                    # Try with MSBuild as fallback
                    msbuild $slnFile.Name /p:Configuration=$config /p:Platform="Any CPU" /m 2>&1 | Tee-Object -Variable msbuildOutput
                    Write-Host $msbuildOutput
                    
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host "✓ Successfully built $($slnFile.Name) [$config] with MSBuild"
                    } else {
                      Write-Host "✗ Both dotnet build and MSBuild failed for $($slnFile.Name) [$config]" -ForegroundColor Red
                      Write-Host "MSBuild errors:" -ForegroundColor Red
                      Write-Host $msbuildOutput -ForegroundColor Red
                      exit 1
                    }
                  }
                }
              }
              
              # Capture changes in BHoM folder
              $changedFiles = @()
              if (Test-Path "$env:BHoMFolder") {
                Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
                  $file = $_.FullName
                  $lastWrite = $_.LastWriteTime
                  
                  # File is new or modified
                  if (-not $preFiles.ContainsKey($file) -or $preFiles[$file] -ne $lastWrite) {
                    $changedFiles += $file
                  }
                }
              }
              
              Write-Host "Dependency $repo_name modified/added $($changedFiles.Count) files in BHoM folder"
              
            } finally {
              Pop-Location
            }
          }
        shell: pwsh

      - name: Upload dependencies artifact
        id: build-summary
        run: |
          # Create dependencies artifact from BHoM folder
          if (Test-Path "$env:BHoMFolder") {
            Write-Host "Packaging dependencies from BHoM folder..."
            
            # Count files in BHoM folder
            $files = Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue
            Write-Host "Found $($files.Count) files in BHoM folder to package as dependencies"
            
            if ($files.Count -gt 0) {
              echo "dependencies-built=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
              Write-Host "No files found in BHoM folder"
            }
          } else {
            echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
            Write-Host "BHoM folder does not exist"
          }
        shell: pwsh

      - name: Download Test Toolkit Tests
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          Write-Host "Downloading Test Toolkit Tests from BHoM/Test_Toolkit..."
          
          $targetRepo = "BHoM/Test_Toolkit"
          $branchName = '${{ inputs.branch_name }}'
          $artifactName = "Tests"
          
          # Branch priority order
          $branchesToTry = @(
            $branchName,
            "develop", 
            "Test_Toolkit-InvestigateRunningAllChecksThroughNUnit"
          )
          
          Write-Host "Branch priority order: $($branchesToTry -join ', ')"
          
          $foundArtifact = $false
          
          foreach ($testBranch in $branchesToTry) {
            if ($foundArtifact) { break }
            
            Write-Host "Trying branch: $testBranch"
            
            try {
              # Get recent successful runs from this branch
              $runsResponse = gh api "/repos/$targetRepo/actions/runs?status=success&per_page=10" 2>$null
              if ($runsResponse) {
                $runs = $runsResponse | ConvertFrom-Json
                $branchRuns = $runs.workflow_runs | Where-Object { $_.head_branch -eq $testBranch }
                
                if ($branchRuns -and $branchRuns.Count -gt 0) {
                  Write-Host "Found $($branchRuns.Count) successful runs on branch '$testBranch'"
                  
                  # Check the most recent run for artifacts
                  $latestRun = $branchRuns[0]
                  Write-Host "Checking latest run: $($latestRun.id)"
                  
                  $artifactsResponse = gh api "/repos/$targetRepo/actions/runs/$($latestRun.id)/artifacts" 2>$null
                  if ($artifactsResponse) {
                    $artifacts = $artifactsResponse | ConvertFrom-Json
                    $targetArtifact = $artifacts.artifacts | Where-Object { $_.name -eq $artifactName }
                    
                    if ($targetArtifact) {
                      Write-Host "✓ Found artifact '$artifactName' in run $($latestRun.id) on branch '$testBranch'"
                      
                      # Download the artifact
                      Write-Host "Downloading artifact..."
                      gh api "/repos/$targetRepo/actions/artifacts/$($targetArtifact.id)/zip" > "$artifactName.zip"
                      
                      if (Test-Path "$artifactName.zip") {
                        Write-Host "✓ Successfully downloaded $artifactName.zip"
                        
                        # Create _Tests_ directory
                        if (Test-Path "_Tests_") {
                          Write-Host "Removing existing _Tests_ folder..."
                          Remove-Item "_Tests_" -Recurse -Force
                        }
                        New-Item -ItemType Directory -Force -Path "_Tests_" | Out-Null
                        
                        # Extract the artifact
                        Write-Host "Extracting artifact to _Tests_ folder..."
                        Expand-Archive "$artifactName.zip" -DestinationPath "_Tests_" -Force
                        
                        # Clean up the downloaded zip
                        Remove-Item "$artifactName.zip" -Force
                        
                        # Show what we extracted
                        Write-Host "✓ Test artifacts extracted to _Tests_ folder:"
                        $testFiles = Get-ChildItem "_Tests_" -Recurse -File | Select-Object -First 5
                        foreach ($file in $testFiles) {
                          $relativePath = $file.FullName.Replace("$((Get-Location).Path)\_Tests_\", "")
                          Write-Host "  $relativePath"
                        }
                        if ((Get-ChildItem "_Tests_" -Recurse -File).Count -gt 5) {
                          Write-Host "  ... and $((Get-ChildItem "_Tests_" -Recurse -File).Count - 5) more files"
                        }
                        
                        $foundArtifact = $true
                        break
                      } else {
                        Write-Host "⚠ Failed to download artifact from branch '$testBranch'"
                      }
                    } else {
                      Write-Host "→ No artifact '$artifactName' found in latest run on branch '$testBranch'"
                    }
                  } else {
                    Write-Host "→ Could not get artifacts for latest run on branch '$testBranch'"
                  }
                } else {
                  Write-Host "→ No successful runs found on branch '$testBranch'"
                }
              } else {
                Write-Host "→ Could not access runs for branch '$testBranch'"
              }
            } catch {
              Write-Host "→ Error checking branch '$testBranch': $($_.Exception.Message)"
            }
          }
          
          if (-not $foundArtifact) {
            Write-Host "✗ Could not find Tests artifact from any branch" -ForegroundColor Red
            Write-Host "Tried branches: $($branchesToTry -join ', ')"
            
            # Create empty _Tests_ folder so the workflow can continue
            if (-not (Test-Path "_Tests_")) {
              New-Item -ItemType Directory -Force -Path "_Tests_" | Out-Null
              Write-Host "Created empty _Tests_ folder"
            }
          }
        shell: pwsh

      - name: Upload Test Toolkit Tests artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test-Toolkit-Tests
          path: _Tests_
          retention-days: 3
          compression-level: 6

      - name: Upload dependencies artifact
        if: steps.build-summary.outputs.dependencies-built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}
          retention-days: 3
          compression-level: 6

  build:
    runs-on: windows-latest
    needs: prepare-dependencies
    outputs:
      test-dll-names: ${{ steps.identify-tests.outputs.test-dll-names }}
    strategy:
      matrix:
        build-configuration: ${{ fromJson(needs.prepare-dependencies.outputs.build-configurations) }}
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2.0.1

      - name: Create BHoM folder
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Download dependencies
        if: needs.prepare-dependencies.outputs.dependencies-built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}

      - name: Copy libs folder to BHoM assemblies
        run: |
          if (Test-Path "libs") {
            Write-Host "Found libs folder, copying DLL files to BHoM assemblies..."
            $libsDlls = Get-ChildItem "libs" -Filter "*.dll" -File -Recurse
            
            if ($libsDlls.Count -gt 0) {
              Write-Host "Found $($libsDlls.Count) DLL files in libs folder:"
              foreach ($dll in $libsDlls) {
                $destinationPath = Join-Path "$env:BHoMFolder\Assemblies" $dll.Name
                Copy-Item $dll.FullName -Destination $destinationPath -Force
                Write-Host "  Copied: $($dll.Name)"
              }
              Write-Host "✓ Successfully copied $($libsDlls.Count) DLL files from libs folder"
            } else {
              Write-Host "No DLL files found in libs folder"
            }
          } else {
            Write-Host "No libs folder found, skipping DLL copy"
          }
        shell: pwsh

      - name: Take pre-build snapshot
        run: |
          # Take snapshot of BHoM folder before build
          $preFiles = @{}
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $preFiles[$_.FullName] = @{
                LastWriteTime = $_.LastWriteTime
                Length = $_.Length
              }
            }
          }
          
          # Save pre-build state to JSON file
          $preFiles | ConvertTo-Json -Depth 3 | Out-File "pre-build-state.json" -Encoding UTF8
          Write-Host "Captured pre-build state: $($preFiles.Count) files"

      - name: Restore and build project
        run: |
          # Find the .sln file in the current directory
          $sln_files = Get-ChildItem -Filter "*.sln" -File
          
          if ($sln_files.Count -eq 0) {
            Write-Host "✗ No .sln file found in root directory" -ForegroundColor Red
            exit 1
          }
          
          if ($sln_files.Count -gt 1) {
            Write-Host "⚠ Multiple .sln files found, using the first one: $($sln_files[0].Name)" -ForegroundColor Yellow
          }
          
          $sln_file = $sln_files[0]
          Write-Host "Building solution: $($sln_file.Name)" -ForegroundColor Cyan
          
          $solutionSuccess = $false
          
          # Step 1: Try dotnet restore AND dotnet build
          Write-Host "Attempting dotnet restore and build for $($sln_file.Name)..."
          
          dotnet restore $sln_file.Name 2>&1 | Tee-Object -Variable restoreOutput
          Write-Host $restoreOutput
          $dotnetRestoreSuccess = ($LASTEXITCODE -eq 0)
          
          $dotnetBuildSuccess = $false
          
          if ($dotnetRestoreSuccess) {
            dotnet build $sln_file.Name --configuration ${{ matrix.build-configuration }} --no-restore 2>&1 | Tee-Object -Variable buildOutput
            Write-Host $buildOutput
            $dotnetBuildSuccess = ($LASTEXITCODE -eq 0)
          }
          
          # Step 2: If either dotnet restore OR dotnet build failed, try MSBuild approach
          if ($dotnetRestoreSuccess -and $dotnetBuildSuccess) {
            Write-Host "✓ Successfully restored and built $($sln_file.Name) with dotnet" -ForegroundColor Green
            $solutionSuccess = $true
          } else {
            Write-Host "✗ dotnet approach failed for $($sln_file.Name), trying MSBuild approach..." -ForegroundColor Yellow
            
            if (-not $dotnetRestoreSuccess) {
              Write-Host "dotnet restore errors:" -ForegroundColor Red
              Write-Host $restoreOutput -ForegroundColor Red
            }
            if (-not $dotnetBuildSuccess -and $dotnetRestoreSuccess) {
              Write-Host "dotnet build errors:" -ForegroundColor Red
              Write-Host $buildOutput -ForegroundColor Red
            }
            
            # Try NuGet restore and MSBuild
            Write-Host "Restoring packages with NuGet..."
            nuget restore $sln_file.Name 2>&1 | Tee-Object -Variable nugetOutput
            Write-Host $nugetOutput
            
            Write-Host "Building with MSBuild..."
            msbuild $sln_file.Name /p:Configuration=${{ matrix.build-configuration }} /p:Platform="Any CPU" /m 2>&1 | Tee-Object -Variable msbuildOutput
            Write-Host $msbuildOutput
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Successfully restored and built $($sln_file.Name) with MSBuild" -ForegroundColor Green
              $solutionSuccess = $true
            } else {
              Write-Host "✗ Both dotnet and MSBuild approaches failed for $($sln_file.Name)" -ForegroundColor Red
              Write-Host "MSBuild errors:" -ForegroundColor Red
              Write-Host $msbuildOutput -ForegroundColor Red
              $solutionSuccess = $false
            }
          }
          
          # Exit with error if build failed
          if (-not $solutionSuccess) {
            Write-Host "✗ Build FAILED for $($sln_file.Name)" -ForegroundColor Red
            exit 1
          } else {
            Write-Host "✓ Build SUCCEEDED for $($sln_file.Name)" -ForegroundColor Green
          }
        shell: pwsh

      - name: Package build outputs
        id: package-outputs
        run: |
          # Load pre-build state
          $preFiles = @{}
          if (Test-Path "pre-build-state.json") {
            $preFiles = Get-Content "pre-build-state.json" -Raw | ConvertFrom-Json -AsHashtable
          }
          
          # Create artifact folder
          New-Item -ItemType Directory -Force -Path "artifact"
          
          # Find all changed/new files in BHoM folder
          $changedFiles = @()
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $file = $_.FullName
              $lastWrite = $_.LastWriteTime
              $length = $_.Length
              
              # Check if file is new or modified
              $isChanged = $false
              if (-not $preFiles.ContainsKey($file)) {
                # New file
                $isChanged = $true
                Write-Host "New file: $($file.Replace("$env:BHoMFolder\", ''))"
              } elseif ($preFiles[$file].LastWriteTime -ne $lastWrite -or $preFiles[$file].Length -ne $length) {
                # Modified file
                $isChanged = $true
                Write-Host "Modified file: $($file.Replace("$env:BHoMFolder\", ''))"
              }
              
              if ($isChanged) {
                $changedFiles += $file
              }
            }
          }
          
          Write-Host "Total changed/new files: $($changedFiles.Count)"
          
          # Copy changed files to artifact, preserving directory structure
          foreach ($file in $changedFiles) {
            $relativePath = $file.Replace("$env:BHoMFolder\", "")
            $destPath = Join-Path "artifact" $relativePath
            $destDir = Split-Path $destPath -Parent
            
            # Create destination directory if it doesn't exist
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            }
            
            # Copy the file
            Copy-Item $file -Destination $destPath -Force
          }
          
          # Also include any files from libs folder that were copied to BHoM assemblies during build
          if (Test-Path "libs") {
            Write-Host "Checking for libs files that may have been copied during build..."
            $libsFiles = Get-ChildItem "libs" -Filter "*" -File -Recurse
            
            foreach ($libFile in $libsFiles) {
              $assemblyPath = Join-Path "$env:BHoMFolder\Assemblies" $libFile.Name
              if (Test-Path $assemblyPath) {
                # Check if this file from libs exists in BHoM assemblies and include it in artifact
                $relativePath = "Assemblies\$($libFile.Name)"
                $destPath = Join-Path "artifact" $relativePath
                $destDir = Split-Path $destPath -Parent
                
                # Create destination directory if it doesn't exist
                if (-not (Test-Path $destDir)) {
                  New-Item -ItemType Directory -Force -Path $destDir | Out-Null
                }
                
                # Copy the file from BHoM assemblies (not from libs, to get the version that was actually used)
                Copy-Item $assemblyPath -Destination $destPath -Force
                Write-Host "  Included libs file in artifact: $($libFile.Name)"
              }
            }
          }
          
          if ($changedFiles.Count -eq 0) {
            Write-Host "No files were changed in $env:BHoMFolder during build"
            # Create empty marker file so artifact isn't empty
            "No files changed during build" | Out-File "artifact\no-changes.txt"
          }
          
          # Collect only the DLL files that were built and changed in this run
          Write-Host "Filtering changed files for DLL assemblies only..."
          
          $updatedDlls = @()
          foreach ($file in $changedFiles) {
            if ($file.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase) -and 
                $file.Contains("$env:BHoMFolder\Assemblies\")) {
              $updatedDlls += $file
              Write-Host "  Found updated assembly: $($file.Replace("$env:BHoMFolder\", ''))"
            }
          }
          
          if ($updatedDlls.Count -gt 0) {
            $updatedDllsString = $updatedDlls -join ';'
            Write-Host "Found $($updatedDlls.Count) updated DLL files for test parameters"
            echo "updated-assemblies=$updatedDllsString" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No updated DLL files found in assemblies folder"
            echo "updated-assemblies=" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ inputs.branch_name }}-${{ matrix.build-configuration }}
          path: artifact/
          retention-days: 90
          compression-level: 6

      - name: Download Test Toolkit Tests
        uses: actions/download-artifact@v4
        with:
          name: Test-Toolkit-Tests
          path: _Tests_

      - name: Identify tests
        id: identify-tests
        run: |
          Write-Host "Searching for test DLLs in _Tests_ folder..."
          
          if (-not (Test-Path "_Tests_")) {
            Write-Host "✗ _Tests_ folder not found" -ForegroundColor Red
            exit 1
          }
          
          # Find all DLL files in _Tests_ folder that contain unit tests
          $testDlls = @()
          $allDlls = Get-ChildItem "_Tests_" -Filter "*.dll" -File -Recurse
          
          if ($allDlls.Count -eq 0) {
            Write-Host "✗ No DLL files found in _Tests_ folder" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "Found $($allDlls.Count) DLL files, pre-filtering for NUnit references..."
          
          foreach ($dll in $allDlls) {
            Write-Host "Checking: $($dll.Name)"
            
            # Skip known non-test DLLs
            $dllBaseName = $dll.BaseName
            if ($dllBaseName -eq "NUnit_Engine" -or $dllBaseName -eq "TestSetup_Engine" -or 
                $dllBaseName -eq "testhost" -or $dllBaseName -eq "testcentric.engine.metadata" -or
                $dllBaseName.StartsWith("System.") -or $dllBaseName.StartsWith("Microsoft.") -or
                $dllBaseName.StartsWith("nunit.", [System.StringComparison]::OrdinalIgnoreCase) -or
                $dllBaseName.StartsWith("NUnit3.") -or
                $dllBaseName.StartsWith("Newtonsoft.") -or $dllBaseName.StartsWith("NuGet.") -or
                $dllBaseName.EndsWith("_oM") -or $dllBaseName.EndsWith("_Engine")) {
              Write-Host "  - Skipping known non-test DLL: $($dll.Name)" -ForegroundColor Gray
              continue
            }
            
            # Pre-filter: Check if DLL references nunit.framework.dll using ildasm or alternative methods
            $hasNUnitReference = $false
            
            try {
              # Method 1: Try using System.Reflection.MetadataLoadContext (more modern approach)
              Add-Type -AssemblyName System.Reflection.MetadataLoadContext -ErrorAction SilentlyContinue
              if ([System.Reflection.MetadataLoadContext] -ne $null) {
                $resolver = [System.Reflection.PathAssemblyResolver]::new(@($dll.Directory.FullName, [System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()))
                $mlc = [System.Reflection.MetadataLoadContext]::new($resolver)
                try {
                  $assembly = $mlc.LoadFromAssemblyPath($dll.FullName)
                  $referencedAssemblies = $assembly.GetReferencedAssemblies()
                  $hasNUnitReference = $referencedAssemblies | Where-Object { $_.Name -eq "nunit.framework" }
                  if ($hasNUnitReference) {
                    Write-Host "  ✓ NUnit framework reference found" -ForegroundColor Cyan
                  } else {
                    Write-Host "  - No NUnit framework reference found, skipping" -ForegroundColor Gray
                  }
                } finally {
                  $mlc.Dispose()
                }
              } else {
                throw "MetadataLoadContext not available"
              }
            } catch {
              # Method 2: Fallback to checking file dependencies using PowerShell and .NET reflection
              try {
                # Load assembly in a separate AppDomain context to avoid locking
                $assemblyBytes = [System.IO.File]::ReadAllBytes($dll.FullName)
                $assembly = [System.Reflection.Assembly]::Load($assemblyBytes)
                $referencedAssemblies = $assembly.GetReferencedAssemblies()
                $hasNUnitReference = $referencedAssemblies | Where-Object { $_.Name -eq "nunit.framework" }
                if ($hasNUnitReference) {
                  Write-Host "  ✓ NUnit framework reference found (via fallback method)" -ForegroundColor Cyan
                } else {
                  Write-Host "  - No NUnit framework reference found, skipping" -ForegroundColor Gray
                }
              } catch {
                Write-Host "  - Could not determine NUnit reference for $($dll.Name), skipping" -ForegroundColor Yellow
                $hasNUnitReference = $false
              }
            }
            
            # Skip if no NUnit reference found
            if (-not $hasNUnitReference) {
              continue
            }
            
            # Now check for actual tests using dotnet test
            Write-Host "  - Checking for actual tests..." -ForegroundColor Cyan
            $testListOutput = & dotnet test "$($dll.FullName)" --list-tests --verbosity quiet 2>&1
            $testListExitCode = $LASTEXITCODE
            
            if ($testListExitCode -eq 0 -and $testListOutput) {
              # Filter out non-test lines and look for actual test methods
              $testLines = $testListOutput | Where-Object { 
                $_ -and $_.Trim() -and 
                $_ -notmatch "^Test run for" -and 
                $_ -notmatch "^Microsoft \(R\)" -and 
                $_ -notmatch "^Copyright \(c\)" -and
                $_ -notmatch "^\s*$" -and
                $_ -match "^\s*\w" 
              }
              
              if ($testLines -and $testLines.Count -gt 0) {
                $testCount = $testLines.Count
                Write-Host "✓ Found $testCount NUnit tests in $($dll.Name)" -ForegroundColor Green
                $testDlls += @{
                  Name = $dll.BaseName
                  FullPath = $dll.FullName
                  TestCount = $testCount
                }
              } else {
                Write-Host "  - No test methods found in $($dll.Name)" -ForegroundColor Yellow
              }
            } else {
              Write-Host "  - Cannot run tests on $($dll.Name) (exit code: $testListExitCode)" -ForegroundColor Yellow
            }
          }
          
          if ($testDlls.Count -eq 0) {
            Write-Host "✗ No test DLLs found in _Tests_ folder" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "✓ Identified $($testDlls.Count) test DLL(s):"
          foreach ($testDll in $testDlls) {
            Write-Host "  - $($testDll.Name) ($($testDll.TestCount) tests)"
          }
          
          # Convert to JSON for output
          $testDllsJson = $testDlls | ConvertTo-Json -Compress
          echo "test-dlls=$testDllsJson" >> $env:GITHUB_OUTPUT
          
          # Also output just the names for matrix strategy
          $testDllNames = $testDlls | ForEach-Object { $_.Name }
          $testDllNamesJson = $testDllNames | ConvertTo-Json -Compress
          echo "test-dll-names=$testDllNamesJson" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Run individual tests
        run: |
          $testDlls = '${{ steps.identify-tests.outputs.test-dlls }}' | ConvertFrom-Json
          
          if (-not $testDlls -or $testDlls.Count -eq 0) {
            Write-Host "✗ No test DLLs identified" -ForegroundColor Red
            exit 1
          }
          
          # Create test-results directory
          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          
          # Check if we have test parameters to add
          $updatedAssemblies = '${{ steps.package-outputs.outputs.updated-assemblies }}'
          $changedFiles = '${{ needs.prepare-dependencies.outputs.changed-files }}'
          $hasTestParams = $updatedAssemblies -or $changedFiles
          
          $overallSuccess = $true
          $testResults = @()
          
          foreach ($testDll in $testDlls) {
            Write-Host "Running tests for: $($testDll.Name) ($($testDll.TestCount) tests)"
            
            $logFileName = "test-results-$($testDll.Name).trx"
            Write-Host "Log file: $logFileName"
            
            try {
              if ($hasTestParams) {
                Write-Host "Running with test parameters"
                # Use Start-Process to avoid PowerShell escaping issues
                $processArgs = @(
                  "test"
                  "$($testDll.FullPath)"
                  "--verbosity"
                  "normal"
                  "--logger"
                  "trx;LogFileName=$logFileName"
                  "--results-directory"
                  "test-results"
                )
                
                # Add test parameters as separate arguments
                $processArgs += "--"
                
                # Add UpdatedAssemblies parameter if available
                $updatedAssemblies = '${{ steps.package-outputs.outputs.updated-assemblies }}'
                if ($updatedAssemblies) {
                  $processArgs += "TestRunParameters.Parameter(name=`"UpdatedAssemblies`", value=`"$updatedAssemblies`")"
                }
                
                # Add UpdatedFiles parameter if available
                $changedFiles = '${{ needs.prepare-dependencies.outputs.changed-files }}'
                if ($changedFiles) {
                  $processArgs += "TestRunParameters.Parameter(name=`"UpdatedFiles`", value=`"$changedFiles`")"
                }
                
                Write-Host "Executing: dotnet $($processArgs -join ' ')"
                & dotnet @processArgs
              } else {
                Write-Host "Running without additional parameters"
                dotnet test $($testDll.FullPath) --verbosity normal --logger "trx;LogFileName=$logFileName" --results-directory test-results
              }
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✓ Tests passed for $($testDll.Name)" -ForegroundColor Green
                $testResults += @{ Name = $testDll.Name; Status = "Passed"; LogFile = $logFileName }
              } else {
                Write-Host "⚠ Some tests failed for $($testDll.Name)" -ForegroundColor Yellow
                $overallSuccess = $false
                $testResults += @{ Name = $testDll.Name; Status = "Failed"; LogFile = $logFileName }
              }
            } catch {
              Write-Host "✗ Error running tests for $($testDll.Name): $($_.Exception.Message)" -ForegroundColor Red
              $overallSuccess = $false
              $testResults += @{ Name = $testDll.Name; Status = "Error"; LogFile = $logFileName }
            }
          }
          
          Write-Host "Test execution summary:"
          foreach ($result in $testResults) {
            $status = switch ($result.Status) {
              "Passed" { "✓ PASSED" }
              "Failed" { "⚠ FAILED" }
              "Error"  { "✗ ERROR" }
            }
            Write-Host "  $($result.Name): $status"
          }
          
          if (-not $overallSuccess) {
            Write-Host "⚠ Some test DLLs had failures" -ForegroundColor Yellow
            exit 1
          } else {
            Write-Host "✓ All test DLLs passed" -ForegroundColor Green
          }
        shell: pwsh

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.build-configuration }}
          path: test-results/*.trx

  test-report:
    if: always() && needs.build.outputs.test-dll-names != '[]'
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        test-dll: ${{ fromJson(needs.build.outputs.test-dll-names) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Test Results Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Create Test Report for ${{ matrix.test-dll }}
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - ${{ matrix.test-dll }}
          path: test-results/**/test-results-${{ matrix.test-dll }}.trx
          reporter: dotnet-trx
          list-tests: 'failed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
  
