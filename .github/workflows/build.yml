name: Build Workflow

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Branch name for artifact naming'
        required: true
        type: string
    secrets:
      GH_TOKEN:
        description: 'GitHub token for accessing artifacts from other repositories (PAT or GitHub App token). If not provided, will only access public repositories.'
        required: false
      APP_ID:
        description: 'GitHub App ID (alternative to GH_TOKEN)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (alternative to GH_TOKEN)'
        required: false
    outputs:
      build-configurations:
        description: 'JSON array of all build configurations'
        value: ${{ jobs.prepare-dependencies.outputs.build-configurations }}
      release-configurations:
        description: 'JSON array of release build configurations'
        value: ${{ jobs.prepare-dependencies.outputs.release-configurations }}
      changed-files:
        description: 'List of changed files'
        value: ${{ jobs.prepare-dependencies.outputs.changed-files }}
      dependencies-built:
        description: 'Whether dependencies were built'
        value: ${{ jobs.prepare-dependencies.outputs.dependencies-built }}

jobs:
  prepare-dependencies:
    runs-on: ubuntu-latest
    outputs:
      build-configurations: ${{ steps.discover-configs.outputs.build-configurations }}
      release-configurations: ${{ steps.discover-configs.outputs.release-configurations }}
      changed-files: ${{ steps.get-changed-files.outputs.changed-files }}
      dependencies-built: ${{ steps.build-summary.outputs.dependencies-built }}
    env:
      BHoMFolder: "/home/runner/BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: get-changed-files
        run: |
          # Only include all changes except deleted files (A=added, C=copied, M=modified, R=renamed, T=type changed)
          Write-Host "Comparing current branch with develop branch (excluding deleted files only)..."
          $changedFiles = git diff --name-only --diff-filter=ACMRT develop HEAD 2>&1
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Git diff failed, assuming all files changed"
            $changedFiles = @()
          } else {
            $changedFiles = $changedFiles | Where-Object { $_ -is [string] -and $_.Trim() -ne "" }
          }
          
          if ($changedFiles.Count -eq 0) {
            Write-Host "No changed files detected"
            echo "changed-files=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Found $($changedFiles.Count) changed files (excluding deletions)"
            
            # Convert to full paths for consistency
            $fullPaths = @()
            foreach ($file in $changedFiles) {
              $fullPath = Join-Path (Get-Location) $file
              $fullPaths += $fullPath
            }
            
            if ($fullPaths.Count -le 10) {
              Write-Host "Changed files ($($fullPaths.Count)) - excluding deletions:"
              foreach ($file in $fullPaths) {
                Write-Host "  $file"
              }
            } else {
              $displayCount = 10
              Write-Host "Changed files ($($fullPaths.Count)) - excluding deletions (showing first $displayCount):"
              for ($i = 0; $i -lt $displayCount; $i++) {
                Write-Host "  $($fullPaths[$i])"
              }
              Write-Host "  ... and $($fullPaths.Count - $displayCount) more files"
            }
            
            $changedFilesString = $fullPaths -join ';'
            echo "changed-files=$changedFilesString" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Create BHoM folder
        run: mkdir -p "$BHoMFolder/Assemblies"

      - name: Discover build configurations
        id: discover-configs
        run: |
          # Find the .sln file in the current directory
          $sln_files = Get-ChildItem -Filter "*.sln" -File
          
          if ($sln_files.Count -eq 0) {
            Write-Host "No .sln file found in the current directory"
            exit 1
          }
          
          $sln_file = $sln_files[0]
          Write-Host "Analyzing solution file: $($sln_file.Name)"
          
          # Parse the solution file to extract build configurations
          $sln_content = Get-Content $sln_file.FullName
          $configs = @()
          $releaseConfigs = @()
          
          foreach ($line in $sln_content) {
            if ($line -match "^\s*([^|]+)\|") {
              $config = $matches[1].Trim()
              if ($config -and $configs -notcontains $config) {
                $configs += $config
                Write-Host "Found build configuration: $config"
                
                # Identify release configurations (case-insensitive check for "release")
                if ($config -match "release" -or $config -eq "Release") {
                  $releaseConfigs += $config
                  Write-Host "  → Identified as Release configuration"
                }
              }
            }
          }
          
          if ($configs.Count -eq 0) {
            Write-Host "No build configurations found, using defaults"
            $configs = @("Debug", "Release")
            $releaseConfigs = @("Release")
          }
          
          Write-Host "Discovered build configurations:"
          for ($i = 0; $i -lt $configs.Count; $i++) {
            Write-Host "  $($i + 1). $($configs[$i])"
          }
          
          Write-Host "Release configurations (for artifact download):"
          for ($i = 0; $i -lt $releaseConfigs.Count; $i++) {
            Write-Host "  $($i + 1). $($releaseConfigs[$i])"
          }
          
          # Ensure JSON array format for single items
          $configsJson = if ($configs.Count -eq 1) { "[$($configs[0] | ConvertTo-Json -Compress)]" } else { $configs | ConvertTo-Json -Compress }
          $releaseConfigsJson = if ($releaseConfigs.Count -eq 1) { "[$($releaseConfigs[0] | ConvertTo-Json -Compress)]" } else { $releaseConfigs | ConvertTo-Json -Compress }
          
          Write-Host "Build configurations JSON: $configsJson"
          Write-Host "Release configurations JSON: $releaseConfigsJson"
          
          echo "build-configurations=$configsJson" >> $env:GITHUB_OUTPUT
          echo "release-configurations=$releaseConfigsJson" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Check GitHub App secrets
        id: check-app-secrets
        run: |
          if [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "app-secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "app-secrets-available=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.check-app-secrets.outputs.app-secrets-available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download dependency artifacts
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          Write-Host "Using GitHub App authentication"
          Write-Host "Downloading artifacts using pre-determined branches..."
          
          # Dependencies with their target branches
          $dependencies = @(
            @{ repo = "BHoM/BHoM"; branch = "develop" }
          )
          
          $downloadedCount = 0
          
          foreach ($dep in $dependencies) {
            $repo_name = $dep.repo.Split('/')[1]
            $target_branch = $dep.branch
            
            Write-Host "Processing dependency: $($dep.repo) (branch: $target_branch)"
            
            try {
              # Get the latest successful run of "CI Build and Test" workflow on the target branch
              $runsJson = gh api "repos/$($dep.repo)/actions/runs" --jq ".workflow_runs[] | select(.name == \"CI Build and Test\" and .head_branch == \"$target_branch\" and .status == \"completed\")" --paginate
              
              if ($runsJson) {
                $runs = $runsJson | ConvertFrom-Json
                $latestRun = $runs | Sort-Object created_at -Descending | Select-Object -First 1
                
                if ($latestRun) {
                  $run_id = $latestRun.id
                  Write-Host "Found latest CI Build and Test workflow run: $run_id for $($dep.repo) on $target_branch (status: $($latestRun.status), conclusion: $($latestRun.conclusion))"
                  
                  # Wait for the run to complete if it's still in progress
                  $maxWaitTime = 600 # 10 minutes
                  $waitInterval = 10 # 10 seconds
                  $totalWaited = 0
                  
                  while ($latestRun.status -eq "in_progress" -and $totalWaited -lt $maxWaitTime) {
                    Write-Host "Run is still in progress, waiting $waitInterval seconds..."
                    Start-Sleep $waitInterval
                    $totalWaited += $waitInterval
                    
                    # Refresh run status
                    $latestRunJson = gh api "repos/$($dep.repo)/actions/runs/$run_id"
                    $latestRun = $latestRunJson | ConvertFrom-Json
                    Write-Host "Run status: $($latestRun.status), conclusion: $($latestRun.conclusion)"
                    
                    # Check for artifacts even while running
                    try {
                      $artifactsJson = gh api "repos/$($dep.repo)/actions/runs/$run_id/artifacts" --jq '.artifacts'
                      $artifacts = $artifactsJson | ConvertFrom-Json
                      
                      if ($artifacts.Count -gt 0) {
                        Write-Host "Found $($artifacts.Count) artifacts while run is in progress"
                        break
                      }
                    } catch {
                      Write-Host "Could not check artifacts while run is in progress: $($_.Exception.Message)"
                    }
                  }
                  
                  if ($totalWaited -ge $maxWaitTime) {
                    Write-Host "⚠ Timeout waiting for run to complete, proceeding anyway" -ForegroundColor Yellow
                  }
                  
                  # Get artifacts from the run
                  try {
                    $artifactsJson = gh api "repos/$($dep.repo)/actions/runs/$run_id/artifacts" --jq '.artifacts'
                    $artifacts = $artifactsJson | ConvertFrom-Json
                    
                    if ($artifacts.Count -gt 0) {
                      Write-Host "Available artifacts in run ${run_id}:"
                      foreach ($artifact in $artifacts) {
                        Write-Host "  - $($artifact.name) (expires: $($artifact.expires_at))"
                      }
                      
                      # Look for build artifacts for each release configuration
                      $releaseConfigs = '${{ steps.discover-configs.outputs.release-configurations }}' | ConvertFrom-Json
                      $foundArtifact = $false
                      
                      foreach ($config in $releaseConfigs) {
                        $artifactName = "build-outputs-$target_branch-$config"
                        $matchingArtifact = $artifacts | Where-Object { $_.name -eq $artifactName }
                        
                        if ($matchingArtifact) {
                          Write-Host "Found matching artifact: $artifactName"
                          
                          try {
                            # Download the artifact
                            Write-Host "Downloading artifact: $artifactName"
                            gh api "repos/$($dep.repo)/actions/artifacts/$($matchingArtifact.id)/zip" > "$artifactName.zip"
                            
                            if (Test-Path "$artifactName.zip") {
                              Write-Host "✓ Successfully downloaded $artifactName.zip"
                              
                              # Extract to BHoM folder
                              Write-Host "Extracting artifact to BHoM folder..."
                              Expand-Archive "$artifactName.zip" -DestinationPath $env:BHoMFolder -Force
                              
                              # Clean up zip file
                              Remove-Item "$artifactName.zip" -Force
                              
                              Write-Host "✓ Artifact $artifactName extracted successfully"
                              $downloadedCount++
                              $foundArtifact = $true
                              break
                            } else {
                              Write-Host "⚠ Failed to download artifact from branch '$target_branch'"
                            }
                          } catch {
                            Write-Host "⚠ Error downloading artifact $artifactName`: $($_.Exception.Message)" -ForegroundColor Yellow
                          }
                        }
                      }
                      
                      if (-not $foundArtifact) {
                        Write-Host "→ No matching build artifacts found for release configurations in run $run_id"
                      }
                    } else {
                      Write-Host "→ No artifacts found in run $run_id"
                      
                      if ($latestRun.conclusion -ne "success") {
                        Write-Host "⚠ Run conclusion is '$($latestRun.conclusion)', artifacts may not be available" -ForegroundColor Yellow
                        Write-Host "Workflow will exit with error as no artifacts are available from a failed run."
                        exit 1
                      }
                    }
                  } catch {
                    Write-Host "→ Could not get artifacts for latest run on branch '$target_branch': $($_.Exception.Message)"
                  }
                } else {
                  Write-Host "→ No CI Build and Test runs found for $($dep.repo) on $target_branch"
                }
              } else {
                Write-Host "→ Could not access runs for branch '$target_branch'"
              }
            } catch {
              Write-Host "→ Error checking branch '$target_branch': $($_.Exception.Message)"
            }
          }
          
          Write-Host "✓ Artifact resolution completed. Downloaded: $downloadedCount dependencies"
        shell: pwsh

      - name: Compile missing dependencies
        run: |
          # Get all repositories that need to be built
          $repositories = @("BHoM", "BHoM_Engine", "BHoM_Adapter")
          $script:buildOrder = @()
          
          # Dependency mapping
          $dependencyMap = @{
            "BHoM" = @()
            "BHoM_Engine" = @("BHoM")
            "BHoM_Adapter" = @("BHoM", "BHoM_Engine")
          }
          
          # Function to add repository to build order
          function Add-ToBuildOrder {
            param($repo)
            
            if ($script:buildOrder -contains $repo) {
              return
            }
            
            # First add all dependencies
            if ($dependencyMap.ContainsKey($repo)) {
              foreach ($dep in $dependencyMap[$repo]) {
                Add-ToBuildOrder $dep
              }
            }
            
            # Then add the repository itself
            $script:buildOrder += $repo
          }
          
          # Build the order
          foreach ($repo in $repositories) {
            Add-ToBuildOrder $repo
          }
          
          Write-Host "Build order determined:"
          for ($i = 0; $i -lt $script:buildOrder.Count; $i++) {
            $repo = $script:buildOrder[$i]
            if ($dependencyMap.ContainsKey($repo) -and $dependencyMap[$repo].Count -gt 0) {
              $validDeps = $dependencyMap[$repo] | Where-Object { $repositories -contains $_ }
              if ($validDeps.Count -gt 0) {
                Write-Host "$repo depends on: $($validDeps -join ', ')"
              }
            }
            Write-Host "Added $repo to build order (position $($script:buildOrder.Count))" -ForegroundColor Green
          }
          
          # Build each repository in order
          foreach ($repo in $script:buildOrder) {
            Write-Host "Building repository: $repo" -ForegroundColor Cyan
            
            # Clone the repository
            $repoUrl = "https://github.com/BHoM/$repo.git"
            Write-Host "Cloning $repoUrl..."
            
            try {
              git clone $repoUrl
              Push-Location $repo
              
              # Find solution file
              $sln_files = Get-ChildItem -Filter "*.sln" -File
              if ($sln_files.Count -eq 0) {
                Write-Host "No .sln file found in $repo, skipping"
                continue
              }
              
              $sln_file = $sln_files[0]
              Write-Host "Building solution: $($sln_file.Name) with configuration: Release" -ForegroundColor Cyan
              
              # Determine if this is a legacy or SDK-style project
              $csprojFiles = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
              $isLegacyProject = $false
              
              if ($csprojFiles) {
                $csprojContent = Get-Content $csprojFiles.FullName -Raw
                if ($csprojContent -match '<Project\s+ToolsVersion=|<Project\s+DefaultTargets=') {
                  $isLegacyProject = $true
                  Write-Host "Detected legacy .NET Framework project"
                } else {
                  Write-Host "Detected SDK-style project"
                }
              }
              
              if ($isLegacyProject) {
                # Use NuGet restore + MSBuild for legacy projects
                Write-Host "Using NuGet restore + MSBuild for legacy project..."
                
                nuget restore $sln_file.Name
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "NuGet restore failed with exit code: $LASTEXITCODE" -ForegroundColor Red
                  throw "NuGet restore failed"
                }
                
                msbuild $sln_file.Name /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="$env:BHoMFolder\Assemblies\"
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "MSBuild failed with exit code: $LASTEXITCODE" -ForegroundColor Red
                  throw "MSBuild failed"
                }
              } else {
                # Use dotnet for SDK-style projects
                Write-Host "Using dotnet restore + dotnet build for SDK-style project..."
                
                dotnet restore $sln_file.Name
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "dotnet restore failed with exit code: $LASTEXITCODE" -ForegroundColor Red
                  throw "dotnet restore failed"
                }
                
                dotnet build $sln_file.Name --configuration Release --output "$env:BHoMFolder\Assemblies" --no-restore
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "dotnet build failed with exit code: $LASTEXITCODE" -ForegroundColor Red
                  throw "dotnet build failed"
                }
              }
              
              Write-Host "✓ Successfully built $repo" -ForegroundColor Green
              
            } catch {
              Write-Host "✗ Failed to build $repo`: $($_.Exception.Message)" -ForegroundColor Red
              throw "Failed to build $repo"
            } finally {
              Pop-Location
            }
          }
        shell: pwsh

      - name: Upload dependencies artifact
        id: build-summary
        run: |
          # Create dependencies artifact from BHoM folder
          if (Test-Path "$env:BHoMFolder") {
            Write-Host "Packaging dependencies from BHoM folder..."
            
            # Count files in BHoM folder
            $files = Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue
            Write-Host "Found $($files.Count) files in BHoM folder to package as dependencies"
            
            if ($files.Count -gt 0) {
              echo "dependencies-built=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
              Write-Host "No files found in BHoM folder"
            }
          } else {
            echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
            Write-Host "BHoM folder does not exist"
          }
        shell: pwsh

      - name: Upload dependencies artifact
        if: steps.build-summary.outputs.dependencies-built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}
          retention-days: 3
          compression-level: 6

  build:
    runs-on: windows-latest
    needs: prepare-dependencies
    strategy:
      fail-fast: false
      matrix:
        build-configuration: ${{ fromJson(needs.prepare-dependencies.outputs.build-configurations) }}
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2.0.1

      - name: Create BHoM folder
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Download dependencies
        if: needs.prepare-dependencies.outputs.dependencies-built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}

      - name: Copy libs folder to BHoM assemblies
        run: |
          if (Test-Path "libs") {
            Write-Host "Found libs folder, copying DLL files to BHoM assemblies..."
            $libsDlls = Get-ChildItem "libs" -Filter "*.dll" -File -Recurse
            
            if ($libsDlls.Count -gt 0) {
              Write-Host "Found $($libsDlls.Count) DLL files in libs folder:"
              foreach ($dll in $libsDlls) {
                $destinationPath = Join-Path "$env:BHoMFolder\Assemblies" $dll.Name
                Copy-Item $dll.FullName -Destination $destinationPath -Force
                Write-Host "  Copied: $($dll.Name)"
              }
              Write-Host "✓ Successfully copied $($libsDlls.Count) DLL files from libs folder"
            } else {
              Write-Host "No DLL files found in libs folder"
            }
          } else {
            Write-Host "No libs folder found, skipping DLL copy"
          }
        shell: pwsh

      - name: Take pre-build snapshot
        run: |
          # Take a snapshot of files in BHoM folder before building
          $preFiles = @{}
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
              $preFiles[$_.FullName] = $_.LastWriteTime
            }
          }
          
          Write-Host "Pre-build snapshot: $($preFiles.Count) files"
          
          # Store snapshot in a temporary file for the post-build step
          $preFiles | ConvertTo-Json | Out-File "pre-build-snapshot.json" -Encoding UTF8
        shell: pwsh

      - name: Restore and build project
        run: |
          # Find the .sln file in the current directory
          $sln_files = Get-ChildItem -Filter "*.sln" -File
          
          if ($sln_files.Count -eq 0) {
            Write-Host "No .sln file found in the current directory"
            exit 1
          }
          
          $sln_file = $sln_files[0]
          $configuration = "${{ matrix.build-configuration }}"
          Write-Host "Building solution: $($sln_file.Name) with configuration: $configuration" -ForegroundColor Cyan
          
          # Determine if this is a legacy or SDK-style project
          $csprojFiles = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          $isLegacyProject = $false
          
          if ($csprojFiles) {
            $csprojContent = Get-Content $csprojFiles.FullName -Raw
            if ($csprojContent -match '<Project\s+ToolsVersion=|<Project\s+DefaultTargets=') {
              $isLegacyProject = $true
              Write-Host "Detected legacy .NET Framework project"
            } else {
              Write-Host "Detected SDK-style project"
            }
          }
          
          if ($isLegacyProject) {
            # Use NuGet restore + MSBuild for legacy projects
            Write-Host "Using NuGet restore + MSBuild for legacy project..."
            
            nuget restore $sln_file.Name
            if ($LASTEXITCODE -ne 0) {
              Write-Host "NuGet restore failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
            }
            
            msbuild $sln_file.Name /p:Configuration=$configuration /p:Platform="Any CPU" /p:OutputPath="$env:BHoMFolder\Assemblies\"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "MSBuild failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
            }
          } else {
            # Use dotnet for SDK-style projects
            Write-Host "Using dotnet restore + dotnet build for SDK-style project..."
            
            dotnet restore $sln_file.Name
            if ($LASTEXITCODE -ne 0) {
              Write-Host "dotnet restore failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
            }
            
            dotnet build $sln_file.Name --configuration $configuration --output "$env:BHoMFolder\Assemblies" --no-restore
            if ($LASTEXITCODE -ne 0) {
              Write-Host "dotnet build failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
            }
          }
          
          Write-Host "✓ Build completed successfully" -ForegroundColor Green
        shell: pwsh

      - name: Create build artifact and detect changes
        id: build-changes
        run: |
          # Load pre-build snapshot
          $preFilesJson = Get-Content "pre-build-snapshot.json" -Raw
          $preFiles = $preFilesJson | ConvertFrom-Json
          
          # Create artifact directory
          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          
          # Detect changes in BHoM folder
          $changedFiles = @()
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
              $file = $_.FullName
              $lastWrite = $_.LastWriteTime
              
              # File is new or modified
              if (-not $preFiles.PSObject.Properties[$file] -or $preFiles.PSObject.Properties[$file].Value -ne $lastWrite) {
                $changedFiles += $file
              }
            }
          }
          
          Write-Host "Dependency $($env:GITHUB_REPOSITORY) modified/added $($changedFiles.Count) files in BHoM folder"
          
          if ($changedFiles.Count -eq 0) {
            Write-Host "No files were changed in $env:BHoMFolder during build"
            # Create empty marker file so artifact isn't empty
            "No files changed during build" | Out-File "artifact\no-changes.txt"
          }
          
          # Collect only the DLL files that were built and changed in this run
          Write-Host "Filtering changed files for DLL assemblies only..."
          
          $updatedDlls = @()
          foreach ($file in $changedFiles) {
            if ($file.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase) -and 
                $file.Contains("$env:BHoMFolder\Assemblies\")) {
              $updatedDlls += $file
              Write-Host "  Found updated assembly: $($file.Replace("$env:BHoMFolder\", ''))"
            }
          }
          
          if ($updatedDlls.Count -gt 0) {
            $updatedDllsString = $updatedDlls -join ';'
            Write-Host "Found $($updatedDlls.Count) updated DLL files for test parameters"
            echo "updated-assemblies=$updatedDllsString" >> $env:GITHUB_OUTPUT
            
            # Save updated assemblies info to BHoM folder with build config suffix
            $updatedDllsString | Out-File "$env:BHoMFolder\updated-assemblies-${{ matrix.build-configuration }}.txt" -Encoding UTF8
          } else {
            Write-Host "No updated DLL files found in assemblies folder"
            echo "updated-assemblies=" >> $env:GITHUB_OUTPUT
            
            # Create empty file for consistency
            "" | Out-File "$env:BHoMFolder\updated-assemblies-${{ matrix.build-configuration }}.txt" -Encoding UTF8
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ inputs.branch_name }}-${{ matrix.build-configuration }}
          path: artifact/
          retention-days: 90
          compression-level: 6

      - name: Upload BHoM Assemblies
        if: contains(fromJson(needs.prepare-dependencies.outputs.release-configurations), matrix.build-configuration)
        uses: actions/upload-artifact@v4
        with:
          name: bhom-assemblies-${{ matrix.build-configuration }}
          path: ${{ env.BHoMFolder }}
          retention-days: 1
          compression-level: 6
